[package]
name = "neo-ssh"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "NEO-SSH: consolidated native SSH workspace (GUI + CLI) built from ssh4, ssh4gui and ssh5"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tempfile = "3"
rand = "0.8"
url = "2"
ssh-key = { version = "0.6", features = ["ed25519", "encryption"] }
vt100 = { path = "vendor/vt100-0.15.2" }
ssh-rs = { path = "vendor/ssh-rs-0.5.0", features = ["scp"] }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
zeroize = "1"
glob = "0.3"
eframe = "0.28"
egui = "0.28"
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.28.1"
arboard = "3.4"
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "neo-ssh"
path = "src/main.rs"

[lib]
name = "neo_ssh"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
socket2 = { version = "0.4.10", features = ["all"] }
libc = "0.2"

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit-0.28.1" }

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
